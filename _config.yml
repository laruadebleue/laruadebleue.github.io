# Réglages généraux du site La Ruade Bleue
title: La Ruade Bleue
tagline: "Suivez en français les Colts d'Indianapolis"
description: >-
  Récits de matchs, infos et avis sur l'actualité des Indianapolis Colts.
  Un site de fans francophones.
lang: fr
timezone: Europe/Paris

# Adresse publique du site (utilisée pour le plan du site envoyé à Google)
url: https://laruadebleue.github.io

# Page Facebook (affichée en pied de page et sous chaque article)
facebook_url: https://www.facebook.com/profile.php?id=61595169340546

# Génère automatiquement sitemap.xml (la liste des pages pour Google)
# et feed.xml (le flux RSS des articles, pour les publications automatiques)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Adresse des articles : /2026/10/titre-de-l-article/
permalink: /:year/:month/:title/

markdown: kramdown

# Brèves : petites infos sans page à elles, affichées dans la rubrique Brèves
# et relayées en texte seul sur Facebook (flux breves.xml)
collections:
  breves:
    output: false

# Signe ajouté automatiquement au début de chaque brève envoyée sur Facebook (pas sur le site)
signe_breve: "🔵⚪🔵"

exclude:
  - README.md
