# Réglages généraux du site La Ruade Bleue
title: La Ruade Bleue
tagline: Une communauté française de fans des Colts d'Indianapolis
description: >-
  Récits de matchs, infos et avis sur l'actualité des Indianapolis Colts.
  Un site de fans francophones.
lang: fr
timezone: Europe/Paris

# Adresse publique du site (utilisée pour le plan du site envoyé à Google)
url: https://laruadebleue.github.io

# Génère automatiquement sitemap.xml, la liste des pages pour Google
plugins:
  - jekyll-sitemap

# Adresse des articles : /2026/10/titre-de-l-article/
permalink: /:year/:month/:title/

markdown: kramdown

exclude:
  - README.md
