<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{% if page.chapeau %}{{ page.chapeau | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">La Ruade <span class="wordmark-accent">Bleue</span></a>
    <p class="tagline">{{ site.tagline }}</p>
    <nav class="nav" aria-label="Rubriques">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Accueil</a>
      <a href="{{ '/saison-2026/' | relative_url }}"{% if page.url == '/saison-2026/' %} aria-current="page"{% endif %}>Saison 2026</a>
      <a href="{{ '/qui-suis-je/' | relative_url }}"{% if page.url == '/qui-suis-je/' %} aria-current="page"{% endif %}>Qui suis-je ?</a>
    </nav>
  </div>
</header>

<main class="wrap main">
{{ content }}
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <p><strong>La Ruade Bleue</strong> est un site de fans non officiel, sans lien avec les Indianapolis Colts ni la NFL.</p>
    <p><a href="{{ '/mentions-legales/' | relative_url }}">Mentions légales</a></p>
  </div>
</footer>
</body>
</html>
