<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{% if page.chapeau %}{{ page.chapeau | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="fr_FR">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.chapeau %}{{ page.chapeau | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/partage.jpg' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="La Ruade Bleue — Suivez en français les Colts d'Indianapolis">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=3" sizes="any">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}?v=3">
<link rel="alternate" type="application/atom+xml" title="La Ruade Bleue" href="{{ '/feed.xml' | relative_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ '/' | absolute_url }}#organisation",
      "name": "{{ site.title }}",
      "url": "{{ '/' | absolute_url }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ '/assets/img/logo-512.png' | absolute_url }}",
        "width": 512,
        "height": 512
      }{% if site.facebook_url %},
      "sameAs": [{{ site.facebook_url | jsonify }}]{% endif %}
    },
    {
      "@type": "WebSite",
      "@id": "{{ '/' | absolute_url }}#site",
      "name": "{{ site.title }}",
      "url": "{{ '/' | absolute_url }}",
      "description": {{ site.tagline | jsonify }},
      "inLanguage": "fr-FR",
      "publisher": { "@id": "{{ '/' | absolute_url }}#organisation" }
    }{% if page.layout == 'post' %},
    {
      "@type": "BlogPosting",
      "headline": {{ page.title | jsonify }},
      "description": {{ page.chapeau | jsonify }},
      "url": "{{ page.url | absolute_url }}",
      "mainEntityOfPage": "{{ page.url | absolute_url }}",
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "inLanguage": "fr-FR",
      "author": { "@type": "Person", "name": {{ page.auteur | default: 'Ryder Lane' | jsonify }} },
      "publisher": { "@id": "{{ '/' | absolute_url }}#organisation" },
      "isPartOf": { "@id": "{{ '/' | absolute_url }}#site" }
    }{% endif %}
  ]
}
</script>
</head>
<body>
<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <img class="wordmark-logo" src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="152" height="84">
      <span class="wordmark-text">La R<span class="kern">u</span>a<span class="kern">d</span>e <span class="wordmark-accent">Bleue</span></span>
    </a>
    <p class="tagline">{{ site.tagline }}</p>
    <nav class="nav" aria-label="Rubriques">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Accueil</a>
      <a href="{{ '/actu/' | relative_url }}"{% if page.url == '/actu/' %} aria-current="page"{% endif %}>Actu</a>
      <a href="{{ '/autour-des-colts/' | relative_url }}"{% if page.url == '/autour-des-colts/' %} aria-current="page"{% endif %}>Autour des Colts</a>
      <a href="{{ '/qui-suis-je/' | relative_url }}"{% if page.url == '/qui-suis-je/' %} aria-current="page"{% endif %}>Qui suis-je ?</a>
    </nav>
  </div>
</header>

<main class="wrap main">
{{ content }}
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <p><strong>La Ruade Bleue</strong> est un site de fans non officiel, sans lien avec les Indianapolis Colts ni la NFL.</p>
    <p class="footer-links">{% if site.facebook_url %}<a class="footer-fb" href="{{ site.facebook_url }}" target="_blank" rel="noopener"><svg class="fb-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>Facebook</a><span aria-hidden="true">·</span>{% endif %}<a href="{{ '/mentions-legales/' | relative_url }}">Mentions légales</a></p>
  </div>
</footer>
<script data-goatcounter="https://laruadebleue.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
